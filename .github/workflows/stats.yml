name: hub stats
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["stats/render.py", ".github/workflows/stats.yml"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the plugin hub index
        run: git clone --quiet --depth 1 https://github.com/runelite/plugin-hub /tmp/hub
      - name: Render
        run: python3 stats/render.py --hub-dir /tmp/hub --owner "${{ github.repository_owner }}"
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A stats README.md
          git diff --cached --quiet || { git commit -q -m "stats: $(date -u '+%Y-%m-%d %H:%M')" && git push -q; }
